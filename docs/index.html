function MyProfileScreen({ me, onSaved }) {
  const [form, setForm] = React.useState(null);
  const [privacy, setPrivacy] = React.useState(null);
  const [vocab, setVocab] = React.useState({ programs: [], roles: [], houses: [], genders: [], races: [] });
  const [status, setStatus] = React.useState("");
  const [error, setError] = React.useState("");
  const [busy, setBusy] = React.useState(false);

  React.useEffect(() => {
    Promise.all([
      api.get("/api/users/" + encodeURIComponent(me.id)),
      api.get("/api/users/me/privacy"),
      api.get("/api/vocab"),
    ])
      .then(([profile, priv, v]) => {
        setForm({
          first: profile.first || "",
          last: profile.last || "",
          pronouns: profile.pronouns || "",
          year: profile.year || "",
          location: profile.location || "",
          photoUrl: profile.photoUrl || "",
          career: profile.career || "",
          industry: profile.industry || "",
          concentration: profile.concentration || "",
          house: profile.house || "",
          bio: profile.bio || "",
          programs: profile.programs || [],
          pbhaRole: profile.pbhaRole || "",
          involvement: profile.involvement || "",
          gender: profile.gender || "",
          raceEthnicity: profile.raceEthnicity || [],
          openToMentor: !!profile.openToMentor,
          reachOut: profile.reachOut || "",
        });
        setPrivacy(priv);
        setVocab(v);
      })
      .catch((err) => setError(err.message));
  }, [me.id]);

  if (error && !form) return <div className="wrap page"><div className="banner banner-error">{error}</div></div>;
  if (!form) return <div className="wrap page"><p className="meta">Loading…</p></div>;

  const set = (k) => (e) => {
    const v = e.target.type === "checkbox" ? e.target.checked : e.target.value;
    setForm((f) => ({ ...f, [k]: v }));
  };
  const toggleIn = (key) => (name) =>
    setForm((f) => ({
      ...f,
      [key]: f[key].includes(name) ? f[key].filter((x) => x !== name) : [...f[key], name],
    }));
  const toggleProgram = toggleIn("programs");
  const toggleRace = toggleIn("raceEthnicity");

  const save = async (e) => {
    e.preventDefault();
    setBusy(true); setStatus(""); setError("");
    try {
      // Empty text inputs are sent as null, not "", so a cleared field really
      // clears rather than storing a blank string the filters would match.
      const blank = (v) => (v.trim() === "" ? null : v.trim());
      await api.patch("/api/users/me", {
        first: form.first.trim(),
        last: form.last.trim(),
        pronouns: blank(form.pronouns),
        year: Number(form.year),
        location: blank(form.location),
        photoUrl: blank(form.photoUrl),
        career: blank(form.career),
        industry: blank(form.industry),
        concentration: blank(form.concentration),
        house: blank(form.house),
        bio: blank(form.bio),
        programs: form.programs,
        pbhaRole: blank(form.pbhaRole),
        involvement: blank(form.involvement),
        gender: blank(form.gender),
        raceEthnicity: form.raceEthnicity,
        openToMentor: form.openToMentor,
        reachOut: blank(form.reachOut),
      });
      setStatus("Saved.");
      onSaved && onSaved();
    } catch (err) {
      setError(err.message);
    } finally {
      setBusy(false);
    }
  };

  const savePrivacy = async (patch) => {
    const next = { ...privacy, ...patch };
    setPrivacy(next);
    try {
      await api.patch("/api/users/me/privacy", patch);
    } catch (err) {
      setError(err.message);
    }
  };

  return (
    <div className="wrap page" style={{ maxWidth: 880 }}>
      <h1 className="h-1 accent">Your profile</h1>
      <p className="lede" style={{ marginTop: 12 }}>
        This is what other PBHA members see in the directory.
      </p>
      <hr className="rule" style={{ margin: "28px 0 32px" }} />

      <form onSubmit={save}>
        <h2 className="h-2" style={{ marginBottom: 18 }}>You at Harvard</h2>
        <div className="two-up">
          <Field label="First name"><input className="input" value={form.first} onChange={set("first")} required /></Field>
          <Field label="Last name"><input className="input" value={form.last} onChange={set("last")} required /></Field>
          <Field label="Pronouns"><input className="input" value={form.pronouns} onChange={set("pronouns")} placeholder="she/her" /></Field>
          <Field label="Class year"><input className="input" type="number" min="1904" max="2050" value={form.year} onChange={set("year")} required /></Field>
          <Field label="Concentration"><input className="input" value={form.concentration} onChange={set("concentration")} placeholder="Social Studies" /></Field>
          <Field label="House">
            <input className="input" list="house-options" value={form.house} onChange={set("house")} placeholder="Currier" />
            <datalist id="house-options">
              {vocab.houses.map((h) => <option key={h} value={h} />)}
            </datalist>
          </Field>
        </div>

        <hr className="rule" style={{ margin: "36px 0 28px" }} />
        <h2 className="h-2" style={{ marginBottom: 18 }}>You now</h2>
        <div className="two-up">
          <Field label="Where you live"><input className="input" value={form.location} onChange={set("location")} placeholder="Boston, MA" /></Field>
          <Field label="Field of work" hint="Used as a directory filter."><input className="input" value={form.industry} onChange={set("industry")} placeholder="Law & Policy" /></Field>
        </div>
        <Field label="What you do" hint='Written as "Title · Organization" so the directory can show both.'>
          <input className="input" value={form.career} onChange={set("career")}
            placeholder="Immigration Attorney · Greater Boston Legal Services" />
        </Field>
        <Field label="Photo URL"><input className="input" value={form.photoUrl} onChange={set("photoUrl")} placeholder="https://…" /></Field>
        <Field label="About you"><textarea className="input" value={form.bio} onChange={set("bio")} /></Field>

        <hr className="rule" style={{ margin: "36px 0 28px" }} />
        <h2 className="h-2" style={{ marginBottom: 18 }}>You at PBHA</h2>
        <Field label="Role" hint="The most senior role you held.">
          <select className="select" value={form.pbhaRole} onChange={set("pbhaRole")}>
            <option value="">Not listed</option>
            {vocab.roles.map((r) => <option key={r} value={r}>{r}</option>)}
          </select>
        </Field>
        <div className="field">
          <span className="eyebrow" style={{ display: "block", marginBottom: 10 }}>Programs</span>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
            {vocab.programs.map((p) => (
              <button type="button" key={p}
                className={`chip ${form.programs.includes(p) ? "is-on" : ""}`}
                onClick={() => toggleProgram(p)}>{p}</button>
            ))}
          </div>
        </div>
        <Field label="Your involvement"
          hint="Anything the list above misses — a committee, a summer, how you got started.">
          <textarea className="input" value={form.involvement} onChange={set("involvement")} />
        </Field>

        <hr className="rule" style={{ margin: "36px 0 28px" }} />
        <h2 className="h-2" style={{ marginBottom: 12 }}>Mentoring</h2>
        <div className="field">
          <label className={`check ${form.openToMentor ? "is-on" : ""}`}
            onClick={(e) => { e.preventDefault(); setForm((f) => ({ ...f, openToMentor: !f.openToMentor })); }}>
            <span className="box" />
            <span>I'm open to hearing from current students</span>
          </label>
        </div>
        {form.openToMentor && (
          <Field label="Students should reach out to me about:"
            hint="Be specific. This is what a student sees before they write to you.">
            <textarea className="input" value={form.reachOut} onChange={set("reachOut")}
              placeholder="Public health careers, state government, or what running a summer site is actually like." />
          </Field>
        )}

        <hr className="rule" style={{ margin: "36px 0 28px" }} />
        <h2 className="h-2" style={{ marginBottom: 12 }}>Identity</h2>
        <p className="meta" style={{ marginBottom: 20, maxWidth: 620 }}>
          Optional, and hidden from everyone unless you turn it on below. PBHA asks so it can
          see who its alumni body actually is, and so members who want to can find people who
          share their background. You can leave all of it blank.
        </p>
        <Field label="Gender">
          <input className="input" list="gender-options" value={form.gender} onChange={set("gender")} placeholder="Optional" />
          <datalist id="gender-options">
            {vocab.genders.map((g) => <option key={g} value={g} />)}
          </datalist>
        </Field>
        <div className="field">
          <span className="eyebrow" style={{ display: "block", marginBottom: 10 }}>Race and ethnicity</span>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
            {vocab.races.map((r) => (
              <button type="button" key={r}
                className={`chip ${form.raceEthnicity.includes(r) ? "is-on" : ""}`}
                onClick={() => toggleRace(r)}>{r}</button>
            ))}
          </div>
        </div>
        <div className="field">
          <label className={`check ${privacy?.showIdentity ? "is-on" : ""}`}
            onClick={(e) => { e.preventDefault(); savePrivacy({ showIdentity: !privacy.showIdentity }); }}>
            <span className="box" />
            <span>Show my identity on my profile to other signed-in members</span>
          </label>
        </div>

        {error && <div className="banner banner-error" style={{ marginBottom: 16 }}>{error}</div>}
        {status && <div className="banner" style={{ marginBottom: 16 }}>{status}</div>}

        <button className="btn btn-primary" disabled={busy}>{busy ? "Saving…" : "Save profile"}</button>
      </form>

      <hr className="rule" style={{ margin: "44px 0 28px" }} />
      <h2 className="h-2">Privacy</h2>
      <div style={{ display: "flex", flexDirection: "column", gap: 14, marginTop: 18 }}>
        <label className={`check ${privacy?.showInDirectory ? "is-on" : ""}`}
          onClick={(e) => { e.preventDefault(); savePrivacy({ showInDirectory: !privacy.showInDirectory }); }}>
          <span className="box" />
          <span>List me in the directory</span>
        </label>
        <label className={`check ${privacy?.profileVisibility === "ALUMNI" ? "is-on" : ""}`}
          onClick={(e) => {
            e.preventDefault();
            savePrivacy({ profileVisibility: privacy.profileVisibility === "ALUMNI" ? "PRIVATE" : "ALUMNI" });
          }}>
          <span className="box" />
          <span>Let signed-in PBHA members open my full profile</span>
        </label>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ *
 * Shell
 * ------------------------------------------------------------------ */

function App() {
  const [me, setMe] = React.useState(undefined); // undefined = still checking
  const [screen, setScreen] = React.useState("welcome");
  const [profileId, setProfileId] = React.useState(null);

  const loadMe = React.useCallback(async () => {
    try {
      setMe(await api.get("/api/auth/me"));
    } catch {
      setMe(null);
    }
  }, []);

  React.useEffect(() => { loadMe(); }, [loadMe]);

  const signOut = async () => {
    await api.post("/api/auth/signout").catch(() => {});
    setMe(null);
    setScreen("welcome");
    setProfileId(null);
  };

  const openProfile = (id) => { setProfileId(id); setScreen("profile"); };

  return (
    <>
      <SiteBar />

      <header className="site">
        <div className="site-inner">
          <a className="brand" href="#" onClick={(e) => { e.preventDefault(); setScreen("welcome"); }}>
            <span>
              <span className="brand-name">Alumni Network</span><br/>
              <span className="brand-sub">Phillips Brooks House Association</span>
            </span>
          </a>

          {/* Only the alumni section's own nav. Dropping this app under
              pbha.org means adding one Alumni item to their nav and pointing
              it here — see "Integrating with pbha.org" in the README — so
              there is nothing to be gained by restating their menu. */}
          {/* Editing your own profile lives in the account menu, not here,
              so it is not offered in two places at once. */}
          {me && (
            <nav className="site-nav">
              {SECTIONS.map((t) => (
                <button key={t.key}
                  className={t.key === screen || (t.key === "directory" && screen === "profile") ? "is-active" : ""}
                  onClick={() => { setScreen(t.key); setProfileId(null); }}>{t.label}</button>
              ))}
            </nav>
          )}

          <div className="header-actions">
            {me && (
              <AccountMenu
                me={me}
                onProfile={() => setScreen("me")}
                onSignOut={signOut}
              />
            )}
          </div>
        </div>
      </header>

      {me === undefined && <div className="wrap page"><p className="meta">Loading…</p></div>}
      {me === null && <GateScreen onSignedIn={loadMe} />}
      {me && screen === "welcome" && <WelcomeScreen me={me} setScreen={setScreen} />}
      {me && screen === "directory" && <DirectoryScreen onOpenProfile={openProfile} />}
      {me && screen === "study" && <StudyScreen />}
      {me && screen === "profile" && profileId && (
        <ProfileScreen userId={profileId} onBack={() => { setScreen("directory"); setProfileId(null); }} />
      )}
      {me && screen === "me" && <MyProfileScreen me={me} onSaved={loadMe} />}

      <footer className="site">
        <div className="wrap footer-grid">
          <div>
            <h4 className="footer-h">Phillips Brooks House Association</h4>
            <p className="footer-p">HARVARD YARD<br/>CAMBRIDGE, MA 02138</p>
            <p className="footer-p"><strong>PHONE:</strong> (617) 495-5526</p>
            <p className="footer-p"><strong>FAX:</strong> (617) 496-2461</p>
            <p className="footer-p"><strong>EMAIL:</strong>{" "}
              <a href="mailto:pbha@pbha.org">pbha@pbha.org</a></p>
          </div>
          <div>
            <h4 className="footer-h">Alumni</h4>
            <div className="footer-links">
              <a href="https://www.pbha.org/get-involved/join-the-alumni-network"
                target="_blank" rel="noopener noreferrer">Join the Alumni Network</a>
              <a href="https://www.pbha.org/alumni-impact"
                target="_blank" rel="noopener noreferrer">Alumni Impact</a>
              <a href="https://www.pbha.org/reunions"
                target="_blank" rel="noopener noreferrer">PBHA&rsquo;s Reunions</a>
              <a href="https://www.pbha.org/125"
                target="_blank" rel="noopener noreferrer">Road to the 125th</a>
              <a href="https://www.pbha.org/120stories"
                target="_blank" rel="noopener noreferrer">120 Stories</a>
              <a href="https://www.pbha.org/coles-2026"
                target="_blank" rel="noopener noreferrer">Robert Coles &ldquo;Call of Service&rdquo; Lecture</a>
            </div>
          </div>

          <div className="footer-links footer-links-last">
            <a href="https://accessibility.huit.harvard.edu/digital-accessibility-policy"
              target="_blank" rel="noopener noreferrer">Digital Accessibility</a>
            <a href="https://www.pbha.org/accessibility-2"
              target="_blank" rel="noopener noreferrer">Accessibility Information &amp; Bias Report</a>
            <a href="https://www.pbha.org/contact-us"
              target="_blank" rel="noopener noreferrer">Contact Us</a>
            <a href="https://pbha.us4.list-manage.com/subscribe?u=12a6d114426de46cf2848b3a6&amp;id=3f7724366c"
              target="_blank" rel="noopener noreferrer">Subscribe to PBHA&rsquo;s email list</a>
          </div>
        </div>
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
