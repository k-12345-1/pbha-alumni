<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PBHA Alumni Network</title>
<meta name="description" content="The alumni directory of the Phillips Brooks House Association.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* PBHA Alumni Directory
   Type, color, and control shapes are taken from measured values on pbha.org:
     body copy   Work Sans 15px / 500 / 1.6, prose 18.5px / 500 / 1.6
     h1          67px / 700 / 1.4 (their h1 leading really is that loose)
     h2          53px / 700 / 1.19
     h3          32px / 700, in orange — their section heads are orange, not black
     buttons     uppercase 13.3px / 500, letter-spacing .02em, radius 300px
   PBHA uses no cards, borders, or shadows: white ground, generous space, and
   orange for emphasis inside otherwise black text. */

:root {
  --white: #ffffff;
  --ink: #000000;
  --ink-soft: #2b2b2b;
  --ink-mute: #6b6b6b;
  --rule: #e6e6e6;
  --wash: #f6f5f3;
  --wash-2: #eceae6;

  --orange: #f98715;
  --orange-dark: #d96f06;
  --orange-wash: #fdf0e0;
  --navy: #051460;

  --sans: "Work Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;

  --max: 1440px;
  --pad: 40px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--white);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  font-weight: 500;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; }
button, input, select, textarea { font-family: inherit; }

/* ---------- type ---------- */

h1, h2, h3, h4 { margin: 0; font-weight: 700; letter-spacing: 0.01em; }

.h-display { font-size: clamp(40px, 5.2vw, 67px); line-height: 1.4; }
.h-1 { font-size: clamp(34px, 3.9vw, 53px); line-height: 1.19; }
/* Their section heads are orange by default — that is the single strongest
   signature of the site, so it is the default here too. */
.h-2 { font-size: clamp(26px, 2.4vw, 32px); line-height: 1.25; color: var(--orange); }
.h-3 { font-size: 20px; line-height: 1.3; }
.accent { color: var(--orange); }
/* Orange inline emphasis on numbers and key phrases, the way their body copy
   highlights "1,200 student volunteers" and "50 programs". */
.em-n { color: var(--orange); font-weight: 700; }
.em-u { text-decoration: underline; text-underline-offset: 3px; }

.lede { font-size: 18.5px; line-height: 1.6; font-weight: 500; color: var(--ink); }

.eyebrow {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-mute);
}
.meta { font-size: 14px; font-weight: 500; color: var(--ink-mute); line-height: 1.5; }

/* ---------- layout ---------- */

.wrap { max-width: var(--max); margin: 0 auto; padding: 0 var(--pad); }
.page { padding: 56px 0 110px; }
.rule { height: 1px; background: var(--rule); border: 0; }

/* Their announcement strip is white on white with a hairline, not a dark bar. */
.notice-bar {
  background: var(--white);
  color: var(--ink);
  font-size: 13.3px;
  font-weight: 500;
  text-align: center;
  padding: 11px 16px;
  border-bottom: 1px solid var(--rule);
}
.notice-bar strong { font-weight: 700; }
.notice-bar .link { color: var(--orange); text-decoration: underline; text-underline-offset: 3px; }

header.site {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--white);
  border-bottom: 1px solid var(--rule);
}
.site-inner {
  display: flex;
  align-items: center;
  gap: 30px;
  /* Their header stands 108px tall; the sticky one here is a little tighter so
     it does not eat the viewport when scrolled. */
  min-height: 88px;
  padding: 16px var(--pad);
  max-width: var(--max);
  margin: 0 auto;
}
.brand { display: flex; align-items: center; gap: 13px; text-decoration: none; }
.brand-mark {
  width: 35px; height: 51px; flex: none;
  background: var(--ink);
  color: var(--orange);
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.02em;
  line-height: 1.05;
  text-align: center;
}
.brand-name { font-size: 15px; font-weight: 600; line-height: 1.25; }
.brand-sub { font-size: 11px; color: var(--ink-mute); letter-spacing: 0.08em; text-transform: uppercase; }

/* Sentence case, 15px/500, black — not uppercase. */
nav.site-nav { display: flex; align-items: center; gap: 24px; }
nav.site-nav button {
  background: none; border: 0; padding: 6px 0; cursor: pointer;
  font-size: 15px; font-weight: 500; color: var(--ink);
  border-bottom: 2px solid transparent;
}
nav.site-nav button:hover { color: var(--orange); }
nav.site-nav button.is-active { border-bottom-color: var(--orange); }

/* ---------- controls ---------- */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: 300px;
  border: 1px solid transparent;
  /* Their pills are genuinely chunky: 22.5px / 33px. */
  padding: 19px 32px;
  font-size: 13.3px;
  font-weight: 500;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  line-height: 1;
  cursor: pointer;
  transition: background .15s, color .15s, border-color .15s;
  white-space: nowrap;
  text-decoration: none;
}
.btn-primary { background: var(--orange); color: var(--white); border-color: var(--orange); }
.btn-primary:hover { background: var(--orange-dark); border-color: var(--orange-dark); }
.btn-ink { background: var(--ink); color: var(--white); border-color: var(--ink); }
.btn-ink:hover { background: var(--ink-soft); border-color: var(--ink-soft); }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn-ghost:hover { border-color: var(--orange); color: var(--orange); }
.btn-sm { padding: 11px 22px; font-size: 11.5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.field { display: block; margin-bottom: 18px; }
.field > span { display: block; margin-bottom: 7px; }
.input, .select, textarea.input {
  width: 100%;
  padding: 13px 15px;
  border: 1px solid var(--rule);
  border-radius: 2px;
  font-size: 15px;
  font-weight: 500;
  background: var(--white);
  color: var(--ink);
}
.input:focus, .select:focus { outline: 2px solid var(--orange); outline-offset: -1px; border-color: transparent; }
textarea.input { min-height: 100px; resize: vertical; line-height: 1.55; }

.search {
  display: flex; align-items: center; gap: 10px;
  border: 1px solid var(--ink);
  border-radius: 300px;
  padding: 12px 20px;
  background: var(--white);
}
.search input { border: 0; outline: 0; flex: 1; font-size: 14px; font-weight: 500; background: transparent; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--rule);
  background: var(--white);
  border-radius: 300px;
  padding: 6px 13px;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-soft);
  cursor: pointer;
  transition: all .12s;
  line-height: 1.3;
}
.chip:hover { border-color: var(--ink); }
.chip.is-on { background: var(--ink); border-color: var(--ink); color: var(--white); }
.chip-static { cursor: default; background: var(--wash); border-color: transparent; }
.chip-accent { background: var(--orange); border-color: var(--orange); color: var(--white); cursor: default; font-weight: 500; }

.scope-btn {
  text-align: left;
  width: 100%;
  padding: 11px 18px;
  border-radius: 300px;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink-soft);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all .12s;
}
.scope-btn:hover { border-color: var(--ink); }
.scope-btn.is-on { background: var(--orange); border-color: var(--orange); color: var(--white); }

.check {
  display: flex; align-items: flex-start; gap: 10px;
  cursor: pointer; font-size: 13.5px; font-weight: 500; color: var(--ink-soft);
  line-height: 1.45;
}
.check .box {
  width: 16px; height: 16px; flex: none; margin-top: 3px;
  border: 1px solid var(--ink); background: var(--white);
}
.check.is-on .box { background: var(--orange); border-color: var(--orange); }
.check.is-on { color: var(--ink); }

/* ---------- cards ---------- */

/* pbha.org has no cards at all. A directory needs some containment, so these
   stay as flat as possible: hairline rule, square corners, no shadow, and no
   hover lift. */
.card {
  background: var(--white);
  border: 1px solid var(--rule);
  border-radius: 2px;
}

.person-card {
  display: flex; flex-direction: column;
  text-align: left; padding: 0; overflow: hidden;
  cursor: pointer;
  transition: border-color .15s;
}
.person-card:hover { border-color: var(--orange); }
.person-photo {
  aspect-ratio: 5 / 4;
  background: var(--wash-2);
  display: grid; place-items: center;
  position: relative;
  border-bottom: 1px solid var(--rule);
  overflow: hidden;
}
.person-photo img { width: 100%; height: 100%; object-fit: cover; }
.initials { font-size: 36px; font-weight: 700; color: var(--ink); opacity: .22; letter-spacing: 0.04em; }
.stamp {
  position: absolute; top: 12px; left: 12px;
  background: var(--white);
  border-radius: 300px;
  padding: 5px 12px;
  font-size: 9.5px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
}
.stamp-year {
  position: absolute; top: 12px; right: 12px;
  background: var(--orange); color: var(--white);
  border-radius: 300px; padding: 5px 12px;
  font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
}
.person-body { padding: 18px 20px 22px; }

.grid-people { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }

.row-person {
  display: grid;
  grid-template-columns: 46px 1.3fr 1.2fr 1fr 150px;
  gap: 16px; align-items: center;
  width: 100%; text-align: left;
  padding: 15px 20px;
  border: 0; border-bottom: 1px solid var(--rule);
  background: transparent; cursor: pointer;
  transition: background .12s;
  font-weight: 500;
}
.row-person:last-child { border-bottom: 0; }
.row-person:hover { background: var(--wash); }
.avatar {
  width: 46px; height: 46px; border-radius: 50%;
  background: var(--wash-2); display: grid; place-items: center; overflow: hidden;
  font-size: 14px; font-weight: 700; color: var(--ink); opacity: .85;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }

.stat-row { display: flex; gap: 52px; flex-wrap: wrap; }
.stat-n { font-size: 44px; font-weight: 700; line-height: 1.1; color: var(--orange); }

/* Their bulleted facts: orange underlined figure, black text after it. */
.fact-list { list-style: none; margin: 0; padding: 0; }
.fact-list li { font-size: 15px; font-weight: 500; line-height: 1.6; margin-bottom: 8px; }
.fact-list li::before { content: "·"; color: var(--orange); font-weight: 700; margin-right: 10px; }

.empty { padding: 72px 24px; text-align: center; color: var(--ink-mute); }

.banner {
  border-left: 3px solid var(--orange);
  background: var(--orange-wash);
  padding: 13px 17px;
  font-size: 14px;
  font-weight: 500;
}
.banner-error { border-left-color: #c0392b; background: #fdeceb; color: #8c271c; }

footer.site {
  border-top: 1px solid var(--rule);
  padding: 48px 0 64px;
  margin-top: 48px;
}

/* ---------- responsive ---------- */

@media (max-width: 1100px) {
  .grid-people { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 860px) {
  :root { --pad: 20px; }
  .gate-layout { grid-template-columns: 1fr !important; gap: 40px !important; }
  .profile-layout { grid-template-columns: 1fr !important; gap: 28px !important; }
  .directory-layout { grid-template-columns: 1fr !important; }
  .directory-rail { position: static !important; }
  .grid-people { grid-template-columns: 1fr; }
  .row-person { grid-template-columns: 46px 1fr; }
  .row-person > :nth-child(n+3) { grid-column: 2; }
  nav.site-nav { gap: 16px; }
  .site-inner { flex-wrap: wrap; gap: 16px; min-height: 0; }
}

/* Dual-range class-year slider — two overlaid range inputs with the selected
   span painted between them. pointer-events is off on the track so the two
   thumbs stay independently grabbable where they overlap. */
.dual-range {
  -webkit-appearance: none;
  appearance: none;
  background: transparent;
  pointer-events: none;
  margin: 0;
  height: 24px;
}
.dual-range::-webkit-slider-runnable-track { background: transparent; height: 2px; }
.dual-range::-moz-range-track { background: transparent; height: 2px; }
.dual-range::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  pointer-events: auto;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--orange);
  border: 2px solid var(--white);
  box-shadow: 0 0 0 1px var(--orange);
  cursor: pointer;
  margin-top: -7px;
}
.dual-range::-moz-range-thumb {
  pointer-events: auto;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--orange);
  border: 2px solid var(--white);
  box-shadow: 0 0 0 1px var(--orange);
  cursor: pointer;
}

.map-btn {
  width: 30px; height: 30px; padding: 0;
  border: 1px solid var(--rule); background: var(--white); color: var(--ink);
  cursor: pointer; font-size: 15px; line-height: 0;
  display: flex; align-items: center; justify-content: center;
}
.map-btn:hover { border-color: var(--orange); color: var(--orange); }

.card-pad { padding: 24px; }

/* pbha.org runs a row of social glyphs and the DONATE pill at the right of
   the header. */
.header-actions { margin-left: auto; display: flex; align-items: center; gap: 18px; }
.social-row { display: flex; align-items: center; gap: 16px; }
.social-row a { color: var(--ink); display: flex; }
.social-row a:hover { color: var(--orange); }

/* The alumni section's own nav, sitting under the site-wide one — the shape
   any subsection of their site would take. */
.subnav { border-bottom: 1px solid var(--rule); background: var(--white); }
.subnav-inner { display: flex; align-items: center; gap: 24px; padding: 12px var(--pad); }
.subnav button {
  background: none; border: 0; padding: 4px 0; cursor: pointer;
  font-size: 14px; font-weight: 500; color: var(--ink-mute);
  border-bottom: 2px solid transparent;
}
.subnav button:hover { color: var(--orange); }
.subnav button.is-active { color: var(--ink); border-bottom-color: var(--orange); }

@media (max-width: 1180px) {
  nav.site-nav { flex-wrap: wrap; gap: 8px 18px; }
  .social-row { display: none; }
}
</style>

/* ------------------------------------------------------------------ *
 * API client
 * ------------------------------------------------------------------ */

const api = {
  async request(method, path, body) {
    // The static GitHub Pages build has no server behind it, so it installs
    // window.__demoRequest to answer these calls from baked-in data. Nothing
    // defines that hook in the real app, where every call hits the API.
    if (window.__demoRequest) return window.__demoRequest(method, path, body);
    const res = await fetch(path, {
      method,
      credentials: "include",
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.status === 204) return null;
    const text = await res.text();
    const data = text ? JSON.parse(text) : null;
    if (!res.ok) {
      const err = new Error(data?.error?.message || "Something went wrong");
      err.status = res.status;
      err.code = data?.error?.code;
      throw err;
    }
    return data;
  },
  get(path) {
    // Served from the prefetch cache when a hover already fetched it. Only
    // GETs are cached, and only until read, so nothing goes stale on screen.
    const hit = api._cache.get(path);
    if (hit) { api._cache.delete(path); return hit; }
    return api.request("GET", path);
  },
  post(path, body) { return api.request("POST", path, body); },
  patch(path, body) { return api.request("PATCH", path, body); },

  // Warm a GET without caring about the result. Hovering a directory card
  // fires this, so by the time the click handler renders the profile the
  // response is usually already in hand.
  _cache: new Map(),
  prefetch(path) {
    if (api._cache.has(path)) return;
    const p = api.request("GET", path).catch(() => {
      api._cache.delete(path);
      return null;
    });
    api._cache.set(path, p);
    // Do not hold a warmed response forever — a stale profile is worse than
    // a second request.
    setTimeout(() => { if (api._cache.get(path) === p) api._cache.delete(path); }, 30000);
  },
};

function GateScreen({ onSignedIn }) {
  const [mode, setMode] = React.useState("signin");

  // otherwise a visitor who signs out hits required-field validation with
  // nothing to type.
  const demo = !!window.__demoRequest;

    email: demo ? "demo@pbha.example" : "",
    password: demo ? "demo-directory" : "",
    first: "", last: "", year: "", inviteCode: "", acceptTerms: false,
  });
  const [error, setError] = React.useState("");

    const v = e.target.type === "checkbox" ? e.target.checked : e.target.value;
    setForm((f) => ({ ...f, [k]: v }));

    e.preventDefault();

        await api.post("/api/auth/signin", { email: form.email, password: form.password });

        await api.post("/api/auth/signup", {
          email: form.email,
          password: form.password,
          first: form.first,
          last: form.last,

          acceptTerms: true,
          ...(form.inviteCode ? { inviteCode: form.inviteCode } : {}),

    } catch (err) {
      setError(err.message);
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="wrap page">
      <div style={{ display: "grid", gridTemplateColumns: "1.15fr 1fr", gap: 72, alignItems: "start" }}
        className="gate-layout">
        <div>
          <div className="eyebrow" style={{ marginBottom: 18 }}>Phillips Brooks House Association</div>
          <h1 className="h-1 accent">The PBHA Alumni Directory</h1>
          <p className="lede" style={{ marginTop: 24, maxWidth: 580 }}>
            Since <span className="em-n">1904</span>, students have run
            <span className="em-u"> the Phillips Brooks House Association</span> and its
            <span className="em-n"> 80+</span> community programs across Boston and Cambridge.
            This is where they find each other again.
          </p>

          <hr className="rule" style={{ margin: "36px 0 28px" }} />

          <ul className="fact-list" style={{ maxWidth: 520 }}>
            <li>Search by <span className="em-n em-u">program</span>, class year, city, or field of work</li>
            <li>Find alumni <span className="em-n em-u">open to mentoring</span> current students</li>
            <li>Current students and alumni in <span className="em-n em-u">one</span> directory</li>
          </ul>

          <p className="meta" style={{ marginTop: 32, maxWidth: 520 }}>
            Visible to signed-in members only. Profiles are never sold, exported, or added to
            mailing lists, and any member can hide their own.
          </p>
        </div>

        <div className="card" style={{ padding: 32 }}>
          <div style={{ display: "flex", gap: 8, marginBottom: 24 }}>
            <button className={`btn btn-sm ${mode === "signin" ? "btn-ink" : "btn-ghost"}`}
              onClick={() => { setMode("signin"); setError(""); }}>Sign in</button>
            <button className={`btn btn-sm ${mode === "signup" ? "btn-ink" : "btn-ghost"}`}
              onClick={() => { setMode("signup"); setError(""); }}>Join</button>
          </div>

          <form onSubmit={submit}>
            {mode === "signup" && (
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
                <Field label="First name">
                  <input className="input" value={form.first} onChange={set("first")} required />
                </Field>
                <Field label="Last name">
                  <input className="input" value={form.last} onChange={set("last")} required />
                </Field>
              </div>
            )}
            {mode === "signup" && (
              <Field label="Class year" hint="The year you graduated, or expect to.">
                <input className="input" type="number" min="1930" max="2050"
                  value={form.year} onChange={set("year")} required />
              </Field>
            )}
            <Field label="Email">
              <input className="input" type="email" autoComplete="email"
                value={form.email} onChange={set("email")} required />
            </Field>
            <Field label="Password"
              hint={mode === "signup" ? "At least 10 characters." : undefined}>
              <input className="input" type="password"
                autoComplete={mode === "signup" ? "new-password" : "current-password"}
                value={form.password} onChange={set("password")} required />
            </Field>
            {mode === "signup" && (
              <Field label="Invite code" hint="Only if PBHA gave you one.">
                <input className="input" value={form.inviteCode} onChange={set("inviteCode")} />
              </Field>
            )}

            {mode === "signup" && (
              <p className="meta" style={{ marginBottom: 18 }}>
                By joining you agree to use the directory to reconnect with PBHA members, and
                not to export it, scrape it, or add anyone to a mailing list without asking.
              </p>
            )}

            {error && <div className="banner banner-error" style={{ marginBottom: 16 }}>{error}</div>}

            {demo && (
              <p className="meta" style={{ marginBottom: 16, fontSize: 13 }}>
                Preview of a directory that is not live yet — any email and password will
                sign you in, and the members you will see are invented.
              </p>
            )}

            <button className="btn btn-primary" style={{ width: "100%" }} disabled={busy}>
              {busy ? "One moment…" : mode === "signin" ? "Sign in" : "Create account"}
            </button>
          </form>
        </div>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ *
 * Directory
 * ------------------------------------------------------------------ */

/* ------------------------------------------------------------------ *
 * Directory map — where members are, on a Robinson world projection.
 *
 * Ported from the FOP alumni directory. Three inputs, all static and
 * already cached: the projected country outlines (geo/world.json), the
 * text-to-coordinate lookup built by scripts/geocode-locations.js
 * (geo/locations.json), and the location counts the directory already
 * fetches for its facets. Nothing geocodes at request time.
 *
 * Paths are relative, not root-absolute, so the same code works served
 * from the site root and from the /pbha-alumni/ GitHub Pages base.
 * ------------------------------------------------------------------ */

// Bump when geo/*.json is rebuilt — those files are cached, so without a
// version a regenerated map keeps showing the previous build.
const GEO_V = "1";

// How far the map will zoom. The outlines are Natural Earth 50m; past this
// a screen pixel is finer than the source geometry.
const MAX_Z = 64;

// Shorthands folded onto the full name so they land on one dot rather than
// two stacked in the same spot. Must match CANON in scripts/geocode-locations.js.
const CANON = {
  "cambridge": "cambridge, ma",
  "boston": "boston, ma",
  "sf": "san francisco, ca",
  "san francisco": "san francisco, ca",
  "nyc": "new york, ny",
  "new york city": "new york, ny",
  "dc": "washington, dc",
  "washington, d.c.": "washington, dc",
  "london": "london, uk",
};

function DirectoryMap({ locations, people, onOpenProfile }) {
  const [world, setWorld] = React.useState(null);
  const [coords, setCoords] = React.useState(null);
  const [failed, setFailed] = React.useState(false);
  const [hover, setHover] = React.useState(null);
  const [picked, setPicked] = React.useState(null);
  const isTouch = typeof window !== "undefined" && !!window.matchMedia &&
                  window.matchMedia("(pointer: coarse)").matches;
  const [z, setZ] = React.useState(1);
  const [pan, setPan] = React.useState({ x: 0, y: 0 });
  const svgRef = React.useRef(null);
  const drag = React.useRef(null);
  const gesture = React.useRef(null);

  React.useEffect(() => {
    let dead = false;
    Promise.all([
      fetch("geo/world.json?v=" + GEO_V).then((r) => r.json()),
      fetch("geo/locations.json?v=" + GEO_V).then((r) => r.json()).catch(() => ({})),
    ])
      .then(([w, c]) => { if (!dead) { setWorld(w); setCoords(c); } })
      .catch(() => { if (!dead) setFailed(true); });
    return () => { dead = true; };
  }, []);

  const norm = (v) => {
    const k = String(v || "").toLowerCase().trim().replace(/\s+/g, " ").replace(/\s*,\s*/g, ", ");
    return CANON[k] || k;
  };

  // Robinson, matching scripts/build-world.py exactly. If the two drift the
  // dots stop landing on their coastlines.
  const project = React.useCallback((lat, lon, w) => {
    const PLEN = [1.0000, 0.9986, 0.9954, 0.9900, 0.9822, 0.9730, 0.9600, 0.9427, 0.9216,
                  0.8962, 0.8679, 0.8350, 0.7986, 0.7597, 0.7186, 0.6732, 0.6213, 0.5722, 0.5322];
    const PDIST = [0.0000, 0.0620, 0.1240, 0.1860, 0.2480, 0.3100, 0.3720, 0.4340, 0.4958,
                   0.5571, 0.6176, 0.6769, 0.7346, 0.7903, 0.8435, 0.8936, 0.9394, 0.9761, 1.0000];
    const KX = 0.8487, KY = 1.3523;
    const a = Math.min(Math.abs(lat), 90) / 5;
    const i = Math.min(Math.floor(a), 17);
    const t = a - i;
    const xf = PLEN[i] + (PLEN[i + 1] - PLEN[i]) * t;
    const yf = PDIST[i] + (PDIST[i + 1] - PDIST[i]) * t;
    const x = KX * xf * (lon * Math.PI / 180);
    const y = KY * yf * (lat >= 0 ? 1 : -1);
    const halfW = KX * Math.PI, halfH = KY;
    const sc = Math.min(w.w / (2 * halfW), w.h / (2 * halfH));
    return [x * sc + w.w / 2, w.h / 2 - y * sc];
  }, []);

  // Join counts to coordinates. Several typed spellings can share one place,
  // so sum them onto a single dot instead of stacking near-identical circles.
  const dots = React.useMemo(() => {
    if (!world || !coords) return [];
    const byKey = new Map();
    (locations || []).forEach((l) => {
      const key = norm(l.name);
      const hit = coords[key];
      if (!hit) return;
      const prev = byKey.get(key);
      if (prev) {
        prev.count += l.count;
        if (l.name.length > prev.label.length) prev.label = l.name;
        return;
      }
      byKey.set(key, { key, label: l.name, count: l.count, lat: hit.lat, lon: hit.lon });
    });
    const out = [...byKey.values()];
    const max = out.reduce((m, d) => Math.max(m, d.count), 1);
    out.forEach((d) => {
      const [x, y] = project(d.lat, d.lon, world);
      d.x = x; d.y = y;
      d.r = 3.4 + 11 * Math.sqrt(d.count / max);   // area, not radius, tracks count
    });
    // Biggest first in the DOM so small dots stay clickable on top of them.
    return out.sort((a, b) => b.count - a.count);
  }, [world, coords, locations, project]);

  // Visible window. The base is world.view, the bounding box of the land, so
  // the empty polar ocean is cropped rather than padding the frame. On a phone
  // that crop works against us — it makes the frame wider, and width is what
  // limits a narrow screen — so touch gets the full canvas plus a margin.
  const V = React.useMemo(() => {
    if (!world) return null;
    const land = world.view || [0, 0, world.w, world.h];
    if (!isTouch) return land;
    const padY = world.h * 0.1;
    return [0, -padY, world.w, world.h + padY * 2];
  }, [world, isTouch]);
  const BX = V ? V[0] : 0, BY = V ? V[1] : 0, BW = V ? V[2] : 0, BH = V ? V[3] : 0;
  const CX = BX + BW / 2, CY = BY + BH / 2;
  const vw = BW / z, vh = BH / z;
  const clamp = (pt, zz) => {
    if (!V) return { x: 0, y: 0 };
    const mx = Math.max(0, (BW - BW / zz) / 2);
    const my = Math.max(0, (BH - BH / zz) / 2);
    return { x: Math.max(-mx, Math.min(mx, pt.x)), y: Math.max(-my, Math.min(my, pt.y)) };
  };
  const vx = CX + pan.x - vw / 2;
  const vy = CY + pan.y - vh / 2;

  // Wheel zoom toward the cursor. Bound natively with passive:false so
  // preventDefault actually stops the page scrolling underneath.
  React.useEffect(() => {
    const el = svgRef.current;
    if (!el || !world) return;
    const onWheel = (e) => {
      e.preventDefault();
      const r = el.getBoundingClientRect();
      const fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
      const mx = vx + fx * vw, my = vy + fy * vh;
      const nz = Math.max(1, Math.min(MAX_Z, z * (e.deltaY < 0 ? 1.15 : 1 / 1.15)));
      const nvw = BW / nz, nvh = BH / nz;
      setZ(nz);
      setPan(clamp({ x: (mx - fx * nvw) + nvw / 2 - CX,
                     y: (my - fy * nvh) + nvh / 2 - CY }, nz));
    };
    el.addEventListener("wheel", onWheel, { passive: false });
    return () => el.removeEventListener("wheel", onWheel);
  }, [world, z, pan.x, pan.y, vx, vy, vw, vh]);

  // Touch: two fingers pinch toward the midpoint, one finger pans once zoomed.
  React.useEffect(() => {
    const el = svgRef.current;
    if (!el || !world) return;
    const spread = (a, b) => Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);

    const onStart = (e) => {
      if (e.touches.length === 2) {
        const [a, b] = e.touches;
        gesture.current = {
          mode: "pinch", d: spread(a, b),
          cx: (a.clientX + b.clientX) / 2, cy: (a.clientY + b.clientY) / 2,
          z, pan: { ...pan },
        };
      } else if (e.touches.length === 1 && z > 1) {
        gesture.current = { mode: "pan", x: e.touches[0].clientX, y: e.touches[0].clientY, z, pan: { ...pan } };
      }
    };
    const onMove = (e) => {
      const g = gesture.current;
      if (!g) return;
      const r = el.getBoundingClientRect();
      if (g.mode === "pinch" && e.touches.length === 2) {
        e.preventDefault();
        const [a, b] = e.touches;
        const nz = Math.max(1, Math.min(MAX_Z, g.z * (spread(a, b) / (g.d || 1))));
        // Keep whatever was under the pinch midpoint pinned under it, so the
        // map grows out of the spot being pinched.
        const fx = (g.cx - r.left) / r.width, fy = (g.cy - r.top) / r.height;
        const sw = BW / g.z, sh = BH / g.z;
        const mx = CX + g.pan.x - sw / 2 + fx * sw;
        const my = CY + g.pan.y - sh / 2 + fy * sh;
        const nw = BW / nz, nh = BH / nz;
        setZ(nz);
        setPan(clamp({ x: (mx - fx * nw) + nw / 2 - CX,
                       y: (my - fy * nh) + nh / 2 - CY }, nz));
      } else if (g.mode === "pan" && e.touches.length === 1) {
        e.preventDefault();
        const t = e.touches[0];
        const dx = (t.clientX - g.x) / r.width * (BW / g.z);
        const dy = (t.clientY - g.y) / r.height * (BH / g.z);
        setPan(clamp({ x: g.pan.x - dx, y: g.pan.y - dy }, g.z));
      }
    };
    const onEnd = (e) => {
      if (e.touches.length === 0) { gesture.current = null; return; }
      // Lifting one finger of a pinch hands over to a pan cleanly rather than
      // leaving a stale two-finger gesture running.
      if (e.touches.length === 1) {
        gesture.current = { mode: "pan", x: e.touches[0].clientX, y: e.touches[0].clientY, z, pan: { ...pan } };
      }
    };

    el.addEventListener("touchstart", onStart, { passive: false });
    el.addEventListener("touchmove", onMove, { passive: false });
    el.addEventListener("touchend", onEnd, { passive: false });
    el.addEventListener("touchcancel", onEnd, { passive: false });
    return () => {
      el.removeEventListener("touchstart", onStart);
      el.removeEventListener("touchmove", onMove);
      el.removeEventListener("touchend", onEnd);
      el.removeEventListener("touchcancel", onEnd);
    };
  }, [world, z, pan.x, pan.y]);

  const onDown = (e) => { if (z > 1) drag.current = { x: e.clientX, y: e.clientY, pan: { ...pan } }; };
  const onMove = (e) => {
    if (!drag.current || !world) return;
    const r = e.currentTarget.getBoundingClientRect();
    const dx = (e.clientX - drag.current.x) / r.width * vw;
    const dy = (e.clientY - drag.current.y) / r.height * vh;
    setPan(clamp({ x: drag.current.pan.x - dx, y: drag.current.pan.y - dy }, z));
  };
  const endDrag = () => { drag.current = null; };
  const reset = () => { setZ(1); setPan({ x: 0, y: 0 }); };

  const atPicked = React.useMemo(() => {
    if (!picked) return [];
    return (people || []).filter((p) => norm(p.location) === picked.key);
  }, [picked, people]);

  const placed = dots.reduce((n, d) => n + d.count, 0);

  if (failed) return <div className="card card-pad meta">The map could not be loaded.</div>;
  if (!world || !coords) return <div className="card card-pad meta">Loading the map…</div>;
  if (!dots.length) {
    return (
      <div className="card card-pad meta">
        No locations have been placed on the map yet. Run <code>node scripts/geocode-locations.js</code> to resolve them.
      </div>
    );
  }

  return (
    <div>
      <div className="card" style={{ position: "relative", padding: 0, overflow: "hidden", background: "var(--wash)" }}>
        <svg ref={svgRef} viewBox={`${vx} ${vy} ${vw} ${vh}`}
             style={{ display: "block", width: "100%", height: "auto",
                      cursor: z > 1 ? (drag.current ? "grabbing" : "grab") : "default", touchAction: "none" }}
             onMouseDown={onDown} onMouseMove={onMove} onMouseUp={endDrag} onMouseLeave={endDrag}
             role="img" aria-label="World map of member locations">
          <g fill="var(--white)" stroke="var(--rule)" strokeWidth="0.8" strokeLinejoin="round">
            {world.paths.map((d, i) => <path key={i} d={d} vectorEffect="non-scaling-stroke" />)}
          </g>
          {dots.map((d) => {
            const sel = picked && picked.key === d.key;
            const on = sel || (hover && hover.key === d.key);
            // Dots shrink as the map grows, so a tight cluster pulls apart:
            // Boston and Cambridge are one blob at 1x and two dots by 64x. The
            // floor keeps a single-member place from vanishing.
            const screenR = Math.max(3, (on ? d.r + 1.5 : d.r) * Math.pow(z, -0.35));
            const rr = screenR / z;
            return (
              <circle key={d.key} cx={d.x} cy={d.y} r={rr}
                fill={on ? "var(--orange-dark)" : "var(--orange)"} fillOpacity={on ? 0.95 : 0.7}
                stroke="var(--white)" strokeWidth={1.2 / z} style={{ cursor: "pointer" }}
                onMouseEnter={() => setHover(d)} onMouseLeave={() => setHover(null)}
                onClick={() => setPicked(picked && picked.key === d.key ? null : d)}>
                <title>{d.count} in {d.label}</title>
              </circle>
            );
          })}
        </svg>
        <div style={{ position: "absolute", right: 16, bottom: 16, display: "flex", flexDirection: "column", gap: 6 }}>
          {[["+", () => { const nz = Math.min(MAX_Z, z * 1.5); setZ(nz); setPan((pt) => clamp(pt, nz)); }],
            ["−", () => { const nz = Math.max(1, z / 1.5); setZ(nz); setPan((pt) => clamp(pt, nz)); }]].map(([lab, fn]) => (
            <button key={lab} className="map-btn" onClick={fn}
              aria-label={lab === "+" ? "Zoom in" : "Zoom out"}>{lab}</button>
          ))}
          {z > 1 && (
            <button className="map-btn" onClick={reset} aria-label="Reset the view"
              style={{ fontSize: 9.5, lineHeight: 1, color: "var(--ink-mute)" }}>reset</button>
          )}
        </div>
        {hover && (
          <div style={{ position: "absolute", left: `${((hover.x - vx) / vw) * 100}%`, top: `${((hover.y - vy) / vh) * 100}%`,
                        transform: "translate(-50%, -175%)", pointerEvents: "none", whiteSpace: "nowrap",
                        background: "var(--ink)", color: "var(--white)", fontSize: 12, padding: "5px 10px", borderRadius: 300 }}>
            <strong>{hover.count}</strong> in {hover.label}
          </div>
        )}
      </div>

      {picked && (
        <div className="card" style={{ marginTop: 14, padding: "18px 20px" }}>
          <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 12, marginBottom: 12 }}>
            <div>
              <span className="h-3">{picked.label}</span>
              <span className="meta" style={{ marginLeft: 10 }}>
                {picked.count} {picked.count === 1 ? "member" : "members"}
              </span>
            </div>
            <button onClick={() => setPicked(null)}
              style={{ background: "none", border: 0, padding: 0, font: "inherit", fontSize: 13,
                       color: "var(--ink-mute)", cursor: "pointer", textDecoration: "underline" }}>
              clear
            </button>
          </div>
          {atPicked.length ? (
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(210px, 1fr))", gap: 8 }}>
              {atPicked.map((p) => (
                <button key={p.userId} onClick={() => onOpenProfile(p.userId)}
                  onMouseEnter={() => api.prefetch("/api/users/" + encodeURIComponent(p.userId))}
                  style={{ display: "block", textAlign: "left", width: "100%", background: "transparent",
                           border: "1px solid var(--rule)", borderRadius: 2, padding: "10px 12px",
                           cursor: "pointer", font: "inherit", color: "inherit" }}>
                  <div style={{ fontSize: 14, fontWeight: 500 }}>{p.first} {p.last}</div>
                  {p.career && <div className="meta" style={{ fontSize: 12.5 }}>{splitCareer(p.career).title}</div>}
                </button>
              ))}
            </div>
          ) : (
            // Dot counts come from site-wide facets but the cards come from the
            // current result set, so a filter can legitimately leave a place
            // with nobody to show.
            <p className="meta" style={{ margin: 0 }}>No one here matches the filters you have set.</p>
          )}
        </div>
      )}

      <div className="meta" style={{ marginTop: 10, display: "flex", flexWrap: "wrap", gap: 14, alignItems: "baseline", fontSize: 12.5 }}>
        <span><span className="em-n">{placed}</span> {placed === 1 ? "member" : "members"} across {dots.length} {dots.length === 1 ? "place" : "places"}</span>
        <span style={{ marginLeft: "auto" }}>
          {isTouch ? "Pinch to zoom · drag to pan · tap a place" : "Scroll to zoom · drag to pan · click a place"}
        </span>
      </div>
    </div>
  );
}

const YEAR_MIN = 1950;
const YEAR_MAX = new Date().getFullYear() + 4;
const YEAR_SPAN = YEAR_MAX - YEAR_MIN;

function FilterGroup({ label, children }) {
  return (
    <div style={{ marginBottom: 26 }}>
      <div className="eyebrow" style={{ marginBottom: 10 }}>{label}</div>
      {children}
    </div>
  );
}

function PersonCard({ person, onOpen }) {
  const { title, org } = splitCareer(person.career);
  return (
    <button className="card person-card" onClick={() => onOpen(person.userId)}
      onMouseEnter={() => api.prefetch("/api/users/" + encodeURIComponent(person.userId))}>
      <div className="person-photo">
        <Photo person={person} />
        <span className="stamp">{person.isCurrentStudent ? "Student" : "Alum"}</span>
        <span className="stamp-year">{shortYear(person.year)}</span>
      </div>
      <div className="person-body">
        <h3 className="h-3">{person.first} {person.last}</h3>
        {title && <div className="meta" style={{ marginTop: 5 }}>{title}</div>}
        {org && <div className="meta">{org}</div>}
        {(person.pbhaRole || person.programs.length > 0) && (
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 12 }}>
            {person.pbhaRole && <span className="chip chip-accent">{person.pbhaRole}</span>}
            {person.programs.slice(0, 2).map((p) => (
              <span key={p} className="chip chip-static">{p}</span>
            ))}
            {person.programs.length > 2 && (
              <span className="chip chip-static">+{person.programs.length - 2}</span>
            )}
          </div>
        )}
        {person.location && (
          <div className="meta" style={{ marginTop: 12, display: "inline-flex", alignItems: "center", gap: 5 }}>
            <Pin /> {person.location}
          </div>
        )}
      </div>
    </button>
  );
}

function PersonRow({ person, onOpen }) {
  const { title, org } = splitCareer(person.career);
  return (
    <button className="row-person" onClick={() => onOpen(person.userId)}
      onMouseEnter={() => api.prefetch("/api/users/" + encodeURIComponent(person.userId))}>
      <span className="avatar"><Photo person={person} /></span>
      <span>
        <span style={{ display: "block", fontWeight: 500 }}>{person.first} {person.last}</span>
        <span className="meta">{shortYear(person.year)}{person.isCurrentStudent ? " · Student" : ""}</span>
      </span>
      <span>
        <span style={{ display: "block", fontSize: 13.5 }}>{title || "—"}</span>
        {org && <span className="meta">{org}</span>}
      </span>
      <span className="meta" style={{ display: "inline-flex", alignItems: "center", gap: 5 }}>
        {person.location ? <><Pin /> {person.location}</> : "—"}
      </span>
      <span style={{ display: "flex", gap: 5, flexWrap: "wrap" }}>
        {person.pbhaRole && <span className="chip chip-accent">{person.pbhaRole}</span>}
      </span>
    </button>
  );
}

function DirectoryScreen({ onOpenProfile }) {
  const [q, setQ] = React.useState("");
  const [who, setWho] = React.useState("all");
  const [programs, setPrograms] = React.useState([]);
  const [industries, setIndustries] = React.useState([]);
  const [roles, setRoles] = React.useState([]);
  const [yearFrom, setYearFrom] = React.useState(YEAR_MIN);
  const [yearTo, setYearTo] = React.useState(YEAR_MAX);
  const [mentorOnly, setMentorOnly] = React.useState(false);
  const [sort, setSort] = React.useState("recent");
  const [layout, setLayout] = React.useState("grid");

  const [results, setResults] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState("");
  const [facets, setFacets] = React.useState({
    programs: [], industries: [], locations: [], roles: [], totalAlumni: 0, totalStudents: 0,
  });

  // Facets do not depend on the filters, so they are fetched once.
  React.useEffect(() => {
    api.get("/api/directory/facets").then(setFacets).catch(() => {});
  }, []);

  const toggle = (list, value, set) =>
    set(list.includes(value) ? list.filter((x) => x !== value) : [...list, value]);

  // Refetch on any filter change, debounced so typing a full name fires one
  // request at the end rather than one per keystroke.
  React.useEffect(() => {
    setLoading(true);
    let cancelled = false;
    const handle = setTimeout(() => {
      const params = new URLSearchParams();
      if (q.trim()) params.set("q", q.trim());
      params.set("who", who);
      params.set("sort", sort);
      params.set("yearFrom", String(yearFrom));
      params.set("yearTo", String(yearTo));
      if (mentorOnly) params.set("openToMentor", "true");
      programs.forEach((p) => params.append("program", p));
      industries.forEach((i) => params.append("industry", i));
      roles.forEach((r) => params.append("role", r));
      // The page renders everything in one fetch — no load-more UI — so the
      // page size matches the server's cap.
      params.set("pageSize", "2000");

      api.get("/api/directory?" + params.toString())
        .then((res) => {
          if (cancelled) return;
          setResults(res.items);
          setError("");
        })
        .catch((err) => {
          if (cancelled) return;
          setResults([]);
          setError(err.message);
        })
        .finally(() => { if (!cancelled) setLoading(false); });
    }, 250);
    return () => { cancelled = true; clearTimeout(handle); };
  }, [q, who, sort, yearFrom, yearTo, mentorOnly, programs, industries, roles]);

  const total = facets.totalAlumni + facets.totalStudents;
  const activeFilters = [
    ...programs.map((p) => ({ label: p, clear: () => toggle(programs, p, setPrograms) })),
    ...industries.map((i) => ({ label: i, clear: () => toggle(industries, i, setIndustries) })),
    ...roles.map((r) => ({ label: r, clear: () => toggle(roles, r, setRoles) })),
    ...(mentorOnly ? [{ label: "open to mentor", clear: () => setMentorOnly(false) }] : []),
  ];

  const clearAll = () => {
    setQ(""); setWho("all"); setPrograms([]); setIndustries([]); setRoles([]);
    setYearFrom(YEAR_MIN); setYearTo(YEAR_MAX); setMentorOnly(false);
  };

  return (
    <div className="wrap page">
      <h1 className="h-1 accent">Directory</h1>
      <p className="lede" style={{ marginTop: 14, maxWidth: 660 }}>
        Every PBHA member who has chosen to be listed, searchable by program, class year,
        city, and the work they do now.
      </p>
      <hr className="rule" style={{ margin: "28px 0 32px" }} />

      <div className="directory-layout" style={{ display: "grid", gridTemplateColumns: "260px 1fr", gap: 44 }}>
        <aside className="directory-rail" style={{ position: "sticky", top: 92, alignSelf: "start" }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
            <span className="eyebrow">Filters</span>
            <button onClick={clearAll}
              style={{ background: "none", border: 0, padding: 0, cursor: "pointer",
                       fontSize: 12, textDecoration: "underline", color: "var(--ink-mute)" }}>
              clear all
            </button>
          </div>

          <label className="search" style={{ marginBottom: 24 }}>
            <SearchIcon />
            <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Name, city, employer" />
          </label>

          <FilterGroup label="Show">
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {[
                { k: "all", l: `Everyone · ${total}` },
                { k: "alumni", l: `Alumni · ${facets.totalAlumni}` },
                { k: "students", l: `Current students · ${facets.totalStudents}` },
              ].map((s) => (
                <button key={s.k} className={`scope-btn ${who === s.k ? "is-on" : ""}`}
                  onClick={() => setWho(s.k)}>{s.l}</button>
              ))}
            </div>
          </FilterGroup>

          <FilterGroup label="Class year">
            <div style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 13, fontWeight: 500 }}>
              <span>{yearFrom}</span>
              <div style={{ flex: 1, position: "relative", height: 24 }}>
                <div style={{ position: "absolute", left: 0, right: 0, top: 11, height: 2, background: "var(--rule)" }} />
                <div style={{ position: "absolute", top: 11, height: 2, background: "var(--orange)",
                              left: `${((yearFrom - YEAR_MIN) / YEAR_SPAN) * 100}%`,
                              right: `${100 - ((yearTo - YEAR_MIN) / YEAR_SPAN) * 100}%` }} />
                {/* Two overlaid inputs. The upper one is the max handle; when
                    both sit at the top of the range the min handle is raised
                    above it so it stays grabbable. */}
                <input type="range" className="dual-range" min={YEAR_MIN} max={YEAR_MAX} value={yearFrom}
                  aria-label="Earliest class year"
                  onChange={(e) => setYearFrom(Math.min(Number(e.target.value), yearTo))}
                  style={{ position: "absolute", inset: 0, width: "100%", zIndex: yearFrom > YEAR_MAX - 4 ? 3 : 2 }} />
                <input type="range" className="dual-range" min={YEAR_MIN} max={YEAR_MAX} value={yearTo}
                  aria-label="Latest class year"
                  onChange={(e) => setYearTo(Math.max(Number(e.target.value), yearFrom))}
                  style={{ position: "absolute", inset: 0, width: "100%", zIndex: 2 }} />
              </div>
              <span>{yearTo}</span>
            </div>
          </FilterGroup>

          <FilterGroup label="PBHA role">
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
              {facets.roles.map((r) => (
                <button key={r.name} className={`chip ${roles.includes(r.name) ? "is-on" : ""}`}
                  onClick={() => toggle(roles, r.name, setRoles)}>{r.name}</button>
              ))}
              {facets.roles.length === 0 && <span className="meta">—</span>}
            </div>
          </FilterGroup>

          <FilterGroup label="Program">
            <div style={{ display: "flex", flexDirection: "column", gap: 6, maxHeight: 260, overflowY: "auto" }}>
              {facets.programs.map((p) => (
                <label key={p.name}
                  className={`check ${programs.includes(p.name) ? "is-on" : ""}`}
                  onClick={(e) => { e.preventDefault(); toggle(programs, p.name, setPrograms); }}>
                  <span className="box" />
                  <span>{p.name} <span className="meta">· {p.count}</span></span>
                </label>
              ))}
              {facets.programs.length === 0 && <span className="meta">—</span>}
            </div>
          </FilterGroup>

          <FilterGroup label="Field of work">
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
              {facets.industries.map((i) => (
                <button key={i.name} className={`chip ${industries.includes(i.name) ? "is-on" : ""}`}
                  onClick={() => toggle(industries, i.name, setIndustries)}>
                  {i.name}
                </button>
              ))}
              {facets.industries.length === 0 && <span className="meta">—</span>}
            </div>
          </FilterGroup>

          <FilterGroup label="Mentorship">
            <label className={`check ${mentorOnly ? "is-on" : ""}`}
              onClick={(e) => { e.preventDefault(); setMentorOnly(!mentorOnly); }}>
              <span className="box" />
              <span>Only members open to mentoring</span>
            </label>
          </FilterGroup>
        </aside>

        <section>
          <div style={{ display: "flex", alignItems: "center", gap: 16, flexWrap: "wrap", marginBottom: 20 }}>
            <span className="meta">
              {loading ? "Searching…" : (
                <><span className="em-n">{results.length}</span> of {total} members</>
              )}
            </span>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {activeFilters.map((f) => (
                <button key={f.label} className="chip is-on" onClick={f.clear}>{f.label} ✕</button>
              ))}
            </div>
            <div style={{ display: "flex", gap: 8, marginLeft: "auto", alignItems: "center" }}>
              <select className="select" value={sort} onChange={(e) => setSort(e.target.value)}
                style={{ width: "auto", padding: "8px 12px", fontSize: 13 }}>
                <option value="recent">Recently joined</option>
                <option value="year-desc">Class year — newest</option>
                <option value="year-asc">Class year — oldest</option>
                <option value="name">Last name (A–Z)</option>
              </select>
              <button className={`btn btn-sm ${layout === "grid" ? "btn-ink" : "btn-ghost"}`}
                onClick={() => setLayout("grid")}>Grid</button>
              <button className={`btn btn-sm ${layout === "list" ? "btn-ink" : "btn-ghost"}`}
                onClick={() => setLayout("list")}>List</button>
              <button className={`btn btn-sm ${layout === "map" ? "btn-ink" : "btn-ghost"}`}
                onClick={() => setLayout("map")}>Map</button>
            </div>
          </div>

          {error && <div className="banner banner-error" style={{ marginBottom: 20 }}>{error}</div>}

          {!loading && results.length === 0 && !error && layout !== "map" && (
            <div className="card empty">
              <div className="h-3" style={{ marginBottom: 8 }}>No members match those filters</div>
              <p className="meta">Try widening the class years or clearing a program.</p>
            </div>
          )}

          {layout === "map" ? (
            <DirectoryMap
              locations={facets.locations || []}
              people={results}
              onOpenProfile={onOpenProfile}
            />
          ) : layout === "grid" ? (
            <div className="grid-people">
              {results.map((p) => (
                <PersonCard key={p.userId} person={p} onOpen={onOpenProfile} />
              ))}
            </div>
          ) : (
            results.length > 0 && (
              <div className="card" style={{ overflow: "hidden" }}>
                {results.map((p) => (
                  <PersonRow key={p.userId} person={p} onOpen={onOpenProfile} />
                ))}
              </div>
            )
          )}
        </section>
      </div>
    </div>
  );
}

function ProfileScreen({ userId, onBack }) {
  const [person, setPerson] = React.useState(null);

  React.useEffect(() => {
    setPerson(null);
    setError("");
    api.get("/api/users/" + encodeURIComponent(userId))
      .then(setPerson)
      .catch((err) => setError(err.message));
  }, [userId]);

  if (error) {
    return (
      <div className="wrap page">
        <div className="banner banner-error">{error}</div>
        <button className="btn btn-ghost btn-sm" style={{ marginTop: 20 }} onClick={onBack}>Back</button>
      </div>

  }
  if (!person) return <div className="wrap page"><p className="meta">Loading…</p></div>;

      <button className="btn btn-ghost btn-sm" onClick={onBack} style={{ marginBottom: 28 }}>

            <div className="meta" style={{ marginTop: 10, display: "flex", gap: 18, flexWrap: "wrap" }}>

                <span style={{ display: "inline-flex", alignItems: "center", gap: 5 }}>
                  <Pin /> {person.location}

            <div style={{ marginBottom: 12 }}>
              <span className="chip chip-accent">{person.pbhaRole}</span>
            </div>

            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {person.programs.map((p) => (
                <div key={p} style={{ display: "flex", gap: 10, alignItems: "baseline", flexWrap: "wrap" }}>
                  <span style={{ fontWeight: 500 }}>{p}</span>
                  {programYears[p] && <span className="meta">{programYears[p]}</span>}

              ))}

function MyProfileScreen({ me, onSaved }) {
  const [form, setForm] = React.useState(null);
  const [privacy, setPrivacy] = React.useState(null);
  const [vocab, setVocab] = React.useState({ programs: [], roles: [] });
  const [status, setStatus] = React.useState("");
  const [error, setError] = React.useState("");
  const [busy, setBusy] = React.useState(false);

  React.useEffect(() => {
    Promise.all([
      api.get("/api/users/" + encodeURIComponent(me.id)),
      api.get("/api/users/me/privacy"),
      api.get("/api/vocab"),
    ])
      .then(([profile, priv, v]) => {
        setForm({
          first: profile.first || "",
          last: profile.last || "",
          pronouns: profile.pronouns || "",
          year: profile.year || "",
          location: profile.location || "",
          photoUrl: profile.photoUrl || "",
          career: profile.career || "",
          industry: profile.industry || "",
          concentration: profile.concentration || "",
          bio: profile.bio || "",
          programs: profile.programs || [],
          pbhaRole: profile.pbhaRole || "",
          openToMentor: !!profile.openToMentor,
          reachOut: profile.reachOut || "",
        });
        setPrivacy(priv);
        setVocab(v);
      })
      .catch((err) => setError(err.message));
  }, [me.id]);

  if (error && !form) return <div className="wrap page"><div className="banner banner-error">{error}</div></div>;
  if (!form) return <div className="wrap page"><p className="meta">Loading…</p></div>;

  const set = (k) => (e) => {
    const v = e.target.type === "checkbox" ? e.target.checked : e.target.value;
    setForm((f) => ({ ...f, [k]: v }));
  };
  const toggleProgram = (name) =>
    setForm((f) => ({
      ...f,
      programs: f.programs.includes(name)
        ? f.programs.filter((p) => p !== name)
        : [...f.programs, name],
    }));

  const save = async (e) => {
    e.preventDefault();
    setBusy(true); setStatus(""); setError("");
    try {
      // Empty text inputs are sent as null, not "", so a cleared field really
      // clears rather than storing a blank string the filters would match.
      const blank = (v) => (v.trim() === "" ? null : v.trim());
      await api.patch("/api/users/me", {
        first: form.first.trim(),
        last: form.last.trim(),
        pronouns: blank(form.pronouns),
        year: Number(form.year),
        location: blank(form.location),
        photoUrl: blank(form.photoUrl),
        career: blank(form.career),
        industry: blank(form.industry),
        concentration: blank(form.concentration),
        bio: blank(form.bio),
        programs: form.programs,
        pbhaRole: blank(form.pbhaRole),
        openToMentor: form.openToMentor,
        reachOut: blank(form.reachOut),
      });
      setStatus("Saved.");
      onSaved && onSaved();
    } catch (err) {
      setError(err.message);
    } finally {
      setBusy(false);
    }
  };

  const savePrivacy = async (patch) => {
    const next = { ...privacy, ...patch };
    setPrivacy(next);
    try {
      await api.patch("/api/users/me/privacy", patch);
    } catch (err) {
      setError(err.message);
    }
  };

  return (
    <div className="wrap page" style={{ maxWidth: 880 }}>
      <h1 className="h-1 accent">Your profile</h1>
      <p className="lede" style={{ marginTop: 12 }}>
        This is what other PBHA members see in the directory.
      </p>
      <hr className="rule" style={{ margin: "28px 0 32px" }} />

      <form onSubmit={save}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 18 }}>
          <Field label="First name"><input className="input" value={form.first} onChange={set("first")} required /></Field>
          <Field label="Last name"><input className="input" value={form.last} onChange={set("last")} required /></Field>
          <Field label="Pronouns"><input className="input" value={form.pronouns} onChange={set("pronouns")} /></Field>
          <Field label="Class year"><input className="input" type="number" min="1930" max="2050" value={form.year} onChange={set("year")} required /></Field>
          <Field label="City"><input className="input" value={form.location} onChange={set("location")} placeholder="Boston, MA" /></Field>
          <Field label="Concentration"><input className="input" value={form.concentration} onChange={set("concentration")} /></Field>
        </div>

        <Field label="Work" hint='Written as "Title · Organization" so the directory can show both.'>
          <input className="input" value={form.career} onChange={set("career")}
            placeholder="Immigration Attorney · Greater Boston Legal Services" />
        </Field>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 18 }}>
          <Field label="Field of work" hint="Used as a directory filter."><input className="input" value={form.industry} onChange={set("industry")} placeholder="Law & Policy" /></Field>
          <Field label="Photo URL"><input className="input" value={form.photoUrl} onChange={set("photoUrl")} placeholder="https://…" /></Field>
        </div>

        <Field label="PBHA role">
          <select className="select" value={form.pbhaRole} onChange={set("pbhaRole")}>
            <option value="">Not listed</option>
            {vocab.roles.map((r) => <option key={r} value={r}>{r}</option>)}
          </select>
        </Field>

        <div className="field">
          <span className="eyebrow" style={{ display: "block", marginBottom: 10 }}>Programs</span>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
            {vocab.programs.map((p) => (
              <button type="button" key={p}
                className={`chip ${form.programs.includes(p) ? "is-on" : ""}`}
                onClick={() => toggleProgram(p)}>{p}</button>
            ))}
          </div>
        </div>

        <Field label="About"><textarea className="input" value={form.bio} onChange={set("bio")} /></Field>

        <div className="field">
          <label className={`check ${form.openToMentor ? "is-on" : ""}`}
            onClick={(e) => { e.preventDefault(); setForm((f) => ({ ...f, openToMentor: !f.openToMentor })); }}>
            <span className="box" />
            <span>I'm open to mentoring current students</span>
          </label>
        </div>

        {form.openToMentor && (
          <Field label="Reach out about"><textarea className="input" value={form.reachOut} onChange={set("reachOut")} /></Field>
        )}

        {error && <div className="banner banner-error" style={{ marginBottom: 16 }}>{error}</div>}
        {status && <div className="banner" style={{ marginBottom: 16 }}>{status}</div>}

        <button className="btn btn-primary" disabled={busy}>{busy ? "Saving…" : "Save profile"}</button>
      </form>

      <hr className="rule" style={{ margin: "44px 0 28px" }} />
      <h2 className="h-2">Privacy</h2>
      <div style={{ display: "flex", flexDirection: "column", gap: 14, marginTop: 18 }}>
        <label className={`check ${privacy?.showInDirectory ? "is-on" : ""}`}
          onClick={(e) => { e.preventDefault(); savePrivacy({ showInDirectory: !privacy.showInDirectory }); }}>
          <span className="box" />
          <span>List me in the directory</span>
        </label>
        <label className={`check ${privacy?.profileVisibility === "ALUMNI" ? "is-on" : ""}`}
          onClick={(e) => {
            e.preventDefault();
            savePrivacy({ profileVisibility: privacy.profileVisibility === "ALUMNI" ? "PRIVATE" : "ALUMNI" });
          }}>
          <span className="box" />
          <span>Let signed-in PBHA members open my full profile</span>
        </label>
      </div>
    </div>
  );
}

            <span>
              <span className="brand-name">Phillips Brooks House Association</span><br/>
              <span className="brand-sub">Alumni Network</span>
            </span>
          </a>

          {/* The site-wide nav, with Alumni added as its own tab. Every other
              item is the live pbha.org section it belongs to; Alumni is the
              only one this app serves. */}
          <nav className="site-nav">
            {SITE_NAV.map((item) => (
              <a key={item.label} href={"https://www.pbha.org" + item.href}
                target="_blank" rel="noopener noreferrer"
                style={{ textDecoration: "none", fontSize: 15, fontWeight: 500,
                         padding: "6px 0", borderBottom: "2px solid transparent" }}>
                {item.label}
              </a>
            ))}
            <button className="is-active"
              onClick={() => { setScreen("directory"); setProfileId(null); }}>Alumni</button>
          </nav>

          <div className="header-actions">
            <div className="social-row">
              <a href="https://www.facebook.com/PBHAserves" target="_blank" rel="noopener noreferrer" aria-label="PBHA on Facebook"><Social.facebook /></a>
              <a href="https://www.linkedin.com/company/phillips-brooks-house-association-inc-" target="_blank" rel="noopener noreferrer" aria-label="PBHA on LinkedIn"><Social.linkedin /></a>
              <a href="https://www.instagram.com/pbha" target="_blank" rel="noopener noreferrer" aria-label="PBHA on Instagram"><Social.instagram /></a>
              <a href="mailto:pbha@pbha.org" aria-label="Email PBHA"><Social.mail /></a>
            </div>
            <a className="btn btn-primary btn-sm" href="https://donatenow.networkforgood.org/1439676"
              target="_blank" rel="noopener noreferrer">Donate</a>
          </div>
        </div>
      </header>

      {/* Signed-in members get the alumni section's own nav underneath. */}
      {me && (
        <div className="subnav">
          <div className="wrap subnav-inner" style={{ padding: "12px 0" }}>
            <button className={screen === "directory" || screen === "profile" ? "is-active" : ""}
              onClick={() => { setScreen("directory"); setProfileId(null); }}>Directory</button>
            <button className={screen === "me" ? "is-active" : ""}
              onClick={() => setScreen("me")}>Your profile</button>
            <button style={{ marginLeft: "auto" }} onClick={signOut}>Sign out</button>
          </div>
        </div>
      )}

      {me === undefined && <div className="wrap page"><p className="meta">Loading…</p></div>}
      {me === null && <GateScreen onSignedIn={loadMe} />}
      {me && screen === "directory" && <DirectoryScreen onOpenProfile={openProfile} />}
      {me && screen === "profile" && profileId && (
        <ProfileScreen userId={profileId} onBack={() => { setScreen("directory"); setProfileId(null); }} />
      )}
      {me && screen === "me" && <MyProfileScreen me={me} onSaved={loadMe} />}

      <footer className="site">
        <div className="wrap" style={{ display: "flex", gap: 40, flexWrap: "wrap", justifyContent: "space-between" }}>
          <div style={{ maxWidth: 460 }}>
            <div className="eyebrow">Phillips Brooks House Association</div>
            <p className="meta" style={{ marginTop: 10 }}>
              Harvard's largest student-run public service organization, home to more than 80
              community-based programs across Boston and Cambridge.
            </p>
            <p className="meta" style={{ marginTop: 10 }}>
              Phillips Brooks House, Harvard Yard, Cambridge, MA 02138<br/>
              <a href="mailto:pbha@pbha.org">pbha@pbha.org</a>
            </p>
          </div>
          <div style={{ display: "flex", gap: 48 }}>
            <div>
              <div className="eyebrow" style={{ marginBottom: 10 }}>Alumni</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>
                <a className="meta" href="https://www.pbha.org/alumni" target="_blank" rel="noopener noreferrer">Join the network</a>
                <a className="meta" href="https://www.pbha.org/125" target="_blank" rel="noopener noreferrer">Road to the 125th</a>
                <a className="meta" href="https://www.pbha.org/alumni-impact" target="_blank" rel="noopener noreferrer">Alumni impact</a>
              </div>
            </div>
            <div>
              <div className="eyebrow" style={{ marginBottom: 10 }}>PBHA</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>
                <a className="meta" href="https://www.pbha.org/programs" target="_blank" rel="noopener noreferrer">Programs</a>
                <a className="meta" href="https://www.pbha.org/apply" target="_blank" rel="noopener noreferrer">Volunteer</a>
                <a className="meta" href="https://www.pbha.org/contact-us" target="_blank" rel="noopener noreferrer">Contact</a>
              </div>
            </div>
          </div>
        </div>
        {window.__demoRequest && (
          // One line, in the footer rather than across the top: this is a
          // prototype on a personal GitHub Pages URL, not something PBHA runs.
          <div className="wrap">
            <hr className="rule" style={{ margin: "28px 0 16px" }} />
            <p className="meta" style={{ margin: 0, fontSize: 12.5 }}>
              A work-in-progress prototype of an alumni directory for PBHA, built for review.
              Not an official PBHA service, and the profiles shown are invented.
            </p>
          </div>
        )}
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
